<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Body -->
  <ellipse cx="100" cy="140" rx="45" ry="55" fill="#FF9E64" stroke="#E67E22" stroke-width="2"/>

  <!-- Head -->
  <circle cx="100" cy="70" r="40" fill="#FF9E64" stroke="#E67E22" stroke-width="2"/>

  <!-- Ears -->
  <polygon points="70,25 65,10 85,20" fill="#FF9E64" stroke="#E67E22" stroke-width="2"/>
  <polygon points="130,25 135,10 115,20" fill="#FF9E64" stroke="#E67E22" stroke-width="2"/>
  <polygon points="72,28 70,18 80,25" fill="#FFB88C"/>
  <polygon points="128,28 130,18 120,25" fill="#FFB88C"/>

  <!-- Eyes -->
  <circle cx="85" cy="60" r="5" fill="#000"/>
  <circle cx="115" cy="60" r="5" fill="#000"/>
  <circle cx="86" cy="59" r="1.5" fill="#FFF"/>
  <circle cx="116" cy="59" r="1.5" fill="#FFF"/>

  <!-- Nose -->
  <polygon points="100,78 97,85 103,85" fill="#FFB88C"/>

  <!-- Mouth -->
  <path d="M 100 85 Q 95 92 90 90" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 100 85 Q 105 92 110 90" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Whiskers -->
  <line x1="60" y1="70" x2="45" y2="68" stroke="#000" stroke-width="1"/>
  <line x1="60" y1="80" x2="45" y2="83" stroke="#000" stroke-width="1"/>
  <line x1="140" y1="70" x2="155" y2="68" stroke="#000" stroke-width="1"/>
  <line x1="140" y1="80" x2="155" y2="83" stroke="#000" stroke-width="1"/>

  <!-- Front Left Paw -->
  <rect x="80" y="185" width="12" height="30" rx="6" fill="#FF9E64" stroke="#E67E22" stroke-width="2"/>
  <ellipse cx="86" cy="215" rx="8" ry="6" fill="#FFB88C"/>

  <!-- Front Right Paw -->
  <rect x="108" y="185" width="12" height="30" rx="6" fill="#FF9E64" stroke="#E67E22" stroke-width="2"/>
  <ellipse cx="114" cy="215" rx="8" ry="6" fill="#FFB88C"/>

  <!-- Tail -->
  <path d="M 135 160 Q 180 140 170 80" stroke="#FF9E64" stroke-width="15" fill="none" stroke-linecap="round"/>
  <path d="M 135 160 Q 180 140 170 80" stroke="#E67E22" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
